{% extends "base.html" %}{% block titulo %}Recuperar contraseña{% endblock %}
{% block cuerpo %}<div class="card" style="max-width:420px;margin:32px auto">
<h1>Recuperar contraseña</h1>
<p class="mut">Escriba el correo de su cuenta y le enviamos un enlace para crear una contraseña nueva.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="email">Correo</label><input id="email" name="email" type="email" required autocomplete="username">
<button>Enviar enlace</button></form>
<p><a href="{{ url_for('login') }}">Volver a ingresar</a></p></div>{% endblock %}
