{% extends "base.html" %}{% block titulo %}Responsables{% endblock %}
{% block cuerpo %}<div class="card tabla"><h1>Responsables de alertas</h1>
<p class="mut">Reciben por correo los reportes de vencimientos de <b>{{ usuario.empresa }}</b>.</p>
<table><tr><th>Nombre</th><th>Correo</th><th></th></tr>
{% for f in filas %}<tr><td>{{ f.nombre }}</td><td>{{ f.email }}</td><td>
<form method="post" action="{{ url_for('quitar_responsable', rid=f.id) }}" style="margin:0"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Quitar</button></form></td></tr>{% endfor %}</table>
<h2>Agregar</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="nombre">Nombre</label><input id="nombre" name="nombre"><label for="email">Correo</label><input id="email" name="email" type="email" required>
<button>Agregar</button></form></div>{% endblock %}
