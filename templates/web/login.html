{% extends "base.html" %}{% block titulo %}Ingresar{% endblock %}
{% block cuerpo %}<div class="card" style="max-width:420px;margin:32px auto">
<div class="marca-auth"><img src="{{ url_for('static', filename='marca/simbolo.svg') }}" alt="" width="76" height="76"><b>Vencimientos</b><small>Documentos al día, sin sorpresas</small></div>
<h1>Ingresar</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="email">Correo</label><input id="email" name="email" type="email" required autocomplete="username">
<label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password">
<button>Entrar</button></form>
<p>¿Empresa nueva? <a href="{{ url_for('registro') }}">Regístrela aquí</a></p></div>{% endblock %}
