<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}autCursos{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#5d6677;--bd:#dde1e8;--ac:#0b5cad;--ok:#1a7f4b;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#2f3642;--ac:#5aa2ee;--ok:#4cc38a;--err:#f2726b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}nav b{margin-right:auto}
a{color:var(--ac)}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;margin:16px 0}
label{display:block;margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;margin-top:16px}
button.link{background:none;color:var(--ac);padding:0;margin:0}
.msg{padding:10px 14px;border-radius:8px;margin:12px 0;border:1px solid}.msg.ok{color:var(--ok)}.msg.error{color:var(--err)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}
.tabla{overflow-x:auto}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{border:1px solid var(--bd);border-radius:10px;padding:12px}.kpi b{font-size:28px;display:block}
.vencido,.critico{color:var(--err);font-weight:600}.alerta{color:#b26a00;font-weight:600}.mut{color:var(--mut)}
</style></head><body>
<header><div class="wrap"><nav><b>autCursos</b>
{% if usuario %}<a href="{{ url_for('panel') }}">Panel</a><a href="{{ url_for('importar_vista') }}">Importar Excel</a>
<a href="{{ url_for('alertas') }}">Alertas</a>
<a href="{{ url_for('responsables') }}">Responsables</a><span class="mut">{{ usuario.empresa }}</span>
<form method="post" action="{{ url_for('logout') }}" style="margin:0"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Salir</button></form>
{% else %}<a href="{{ url_for('login') }}">Ingresar</a><a href="{{ url_for('registro') }}">Registrar mi empresa</a>{% endif %}
</nav></div></header>
<main class="wrap">
{% for cat, m in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
{% block cuerpo %}{% endblock %}</main></body></html>
