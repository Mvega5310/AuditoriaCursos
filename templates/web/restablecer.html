{% extends "base.html" %}{% block titulo %}Nueva contraseña{% endblock %}
{% block cuerpo %}<div class="card" style="max-width:420px;margin:32px auto">
<h1>Nueva contraseña</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="password">Contraseña nueva (mínimo {{ minimo }} caracteres)</label>
<input id="password" name="password" type="password" required minlength="{{ minimo }}" autocomplete="new-password">
<label for="password2">Repita la contraseña</label>
<input id="password2" name="password2" type="password" required minlength="{{ minimo }}" autocomplete="new-password">
<button>Guardar contraseña</button></form></div>{% endblock %}
