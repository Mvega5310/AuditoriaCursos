<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{% block title %}autCursos{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; color: #2c2c2c; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; max-width: 520px; width: 100%; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); overflow: hidden; }
    .header { background: #1a5276; color: #fff; padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .header.ok { background: #1e8449; }
    .header.error { background: #c0392b; }
    .header h1 { font-size: 18px; }
    .header .sub { font-size: 12px; opacity: 0.85; margin-top: 4px; }
    .body { padding: 28px; }
    p.help { color: #666; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    .flash { background: #fdf3f2; border-left: 4px solid #c0392b; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; border-radius: 4px; }
    .aviso { background: #fdf6ef; border-left: 4px solid #d35400; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; border-radius: 4px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.4px; }
    input[type="text"], input[type="date"], input[type="password"] { width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; }
    input[type="file"] { width: 100%; margin-bottom: 20px; }
    button, a.boton { display: block; text-align: center; background: #1a5276; color: #fff; border: none; padding: 12px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; width: 100%; text-decoration: none; }
    button:hover, a.boton:hover { background: #154160; }
    a.secundario { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: #1a5276; }
    .header button.salir { width: auto; background: transparent; border: 1px solid rgba(255,255,255,0.6); padding: 6px 12px; font-size: 12px; }
    .acciones { display: flex; gap: 10px; margin-top: 26px; }
    .acciones > * { flex: 1; }
    a.cancelar { background: #eee; color: #444; padding: 12px 20px; border-radius: 6px; text-align: center; text-decoration: none; font-size: 14px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; color: #fff; }
    .badge.alta { background: #1e8449; } .badge.media { background: #b7950b; } .badge.baja { background: #c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header {% block headerclass %}{% endblock %}">{% block header %}{% endblock %}</div>
    <div class="body">
      {% with mensajes = get_flashed_messages() %}
        {% for m in mensajes %}<div class="flash" role="alert">{{ m }}</div>{% endfor %}
      {% endwith %}
      {% block body %}{% endblock %}
    </div>
  </div>
</body>
</html>
